name: Dhun
options:
  deploymentTarget:
    iOS: '17.0'
  bundleIdPrefix: io.github.jaitak2121spec
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
packages:
  DhunCore:
    path: .
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit.git
    revision: 7f75a2299dc329c0b7855afb25d47663a02855cb
targets:
  Dhun:
    type: application
    platform: iOS
    sources: [Dhun]
    dependencies:
      - package: DhunCore
      - package: YouTubeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jaitak2121spec.dhun.ios
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DhunUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DhunUITests]
    dependencies:
      - target: Dhun
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jaitak2121spec.dhun.ios.uitests
schemes:
  Dhun:
    build:
      targets:
        Dhun: all
        DhunUITests: [test]
    test:
      targets: [DhunUITests]
