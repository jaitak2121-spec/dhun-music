name: Dhun Android Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhun-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install the project SDK and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 \
            "platforms;android-37.0" "build-tools;36.0.0" \
            "cmake;3.22.1" "ndk;27.2.12479018"
          # compileSdk=37 resolves this path; the SDK package uses 37.0.
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -f "$SDK_ROOT/platforms/android-37.0/android.jar"
          if [[ ! -f "$SDK_ROOT/platforms/android-37/android.jar" ]]; then
            cp -al "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"
          fi
      - name: Check identity migration and build-settings tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build the debug app
        id: build
        run: bash ./gradlew --no-daemon --max-workers=2 assembleDevDebug --stacktrace
      - name: Run Android unit tests
        run: bash ./gradlew --no-daemon --max-workers=2 testDevDebugUnitTest --stacktrace
      - name: Save the installable universal debug APK
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: dhun-debug
          path: app/build/outputs/apk/dev/debug/*universal*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Save test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dhun-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 3
  preview:
    needs: android
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dhun-debug
          path: apk
      - name: Publish a direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mv apk/app-dev-universal-debug.apk apk/Dhun.apk
          TAG="preview-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apk/Dhun.apk --clobber
          else
            gh release create "$TAG" apk/Dhun.apk --target "$GITHUB_SHA" \
              --prerelease --title "Dhun preview ${GITHUB_RUN_NUMBER}" \
              --notes "Development APK for Android 8+ ARM phones. Source: ${GITHUB_SHA}. Uses Dhun's shared development signing key; not a production release."
          fi
          jq -n --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" '{source:$source, run:$run, developmentSigning:true}' > apk/Android-build.json
          gh release view preview >/dev/null 2>&1 || gh release create preview --target "$GITHUB_SHA" --prerelease --title "Dhun downloads · current previews" --notes "Rolling development downloads. Assets are replaced after successful CI and have no artifact retention expiry. Source revisions are recorded in Android-build.json and Desktop-build.json. Desktop installers are unsigned previews. This private repository requires GitHub access. Older versioned previews remain in Releases." || gh release view preview
          gh release upload preview apk/Dhun.apk apk/Android-build.json --clobber
