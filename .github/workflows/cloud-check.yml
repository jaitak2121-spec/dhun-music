name: Dhun Cloud Check
on:
  push:
    branches: [main]
    paths: ['cloud/**', '.github/workflows/cloud-check.yml']
  pull_request:
    paths: ['cloud/**', '.github/workflows/cloud-check.yml']
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
